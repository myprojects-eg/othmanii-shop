<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>لوحة التحكم - عُثماني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="navbar container">
        <div class="logo">
            <i class="fa-solid fa-utensils logo-icon"></i>
            <span>لوحة تحكم عُثماني</span>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn" style="background:var(--light-bg); color:var(--dark-color);">
                <i class="fa-solid fa-house"></i> الموقع
            </a>
            <button id="btn-logout" class="btn" style="background:var(--light-bg); color:var(--dark-color);">
                <i class="fa-solid fa-right-from-bracket"></i> خروج
            </button>
        </div>
    </div>
</header>

<main class="container page-content">

    <h1 class="page-title" id="form-title">إضافة منتج جديد</h1>

    <div style="background:#fff8e1; border:1px solid #ffe0a3; border-radius:10px; padding:14px 16px; margin-bottom:1.5rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <span style="font-size:0.9rem; color:#7a5c00;">أول مرة بس: استوردي المنتجات القديمة اللي كانت مكتوبة في الكود لقاعدة البيانات.</span>
        <button class="btn btn-primary" onclick="migrateOldProducts()">استيراد المنتجات القديمة</button>
    </div>

    <div class="admin-panel">
        <div class="form-group">
            <label>اسم المنتج *</label>
            <input type="text" id="f-title" placeholder="مثال: قلاية ستانلس ستيل زينوكس">
        </div>

        <div class="admin-grid-2">
            <div class="form-group">
                <label>السعر (جنيه) *</label>
                <input type="number" min="0" id="f-price" placeholder="0">
            </div>
            <div class="form-group">
                <label>المخزون (الكمية المتاحة) *</label>
                <input type="number" min="0" id="f-stock" placeholder="0">
            </div>
        </div>

        <div class="admin-grid-3">
            <div class="form-group">
                <label>القسم الرئيسي *</label>
                <select id="f-main"></select>
            </div>
            <div class="form-group">
                <label>القسم الفرعي</label>
                <select id="f-sub"><option value="">—</option></select>
            </div>
            <div class="form-group">
                <label>النوع</label>
                <select id="f-type"><option value="">—</option></select>
            </div>
        </div>

        <div class="admin-grid-2">
            <div class="form-group">
                <label>المقاسات (افصلي بينهم بفاصلة ،)</label>
                <input type="text" id="f-sizes" placeholder="مثال: 20 سم، 22 سم، 24 سم">
            </div>
            <div class="form-group">
                <label>الألوان (افصلي بينهم بفاصلة ،)</label>
                <input type="text" id="f-colors" placeholder="مثال: فضي، أسود">
            </div>
        </div>

        <div class="form-group">
            <label>وصف المنتج</label>
            <textarea id="f-description" rows="4" placeholder="تفاصيل المنتج، الخامة، المميزات..."></textarea>
        </div>

        <div class="form-group">
            <label>صور المنتج (أول صورة هتكون الصورة الرئيسية)</label>
            <input type="file" id="f-images-input" accept="image/*" multiple>
            <div class="image-preview-row" id="image-preview-row"></div>
            <div id="upload-status" style="font-size:0.85rem; color:#777; margin-top:6px;"></div>
        </div>

        <div style="display:flex; gap:10px; margin-top:1rem;">
            <button class="btn btn-primary" id="btn-save-product">إضافة المنتج</button>
            <button class="btn" id="btn-cancel-edit" style="display:none; background:var(--light-bg); color:var(--dark-color);">إلغاء التعديل</button>
        </div>
    </div>

    <h2 class="section-title" style="margin-top:2.5rem;">المنتجات الحالية</h2>
    <div id="admin-product-count" style="color:#777; font-size:0.9rem; margin-bottom:1rem;"></div>
    <div id="admin-product-list" class="admin-product-list"></div>

</main>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="category-data.js"></script>
<script src="migrate-old-products.js"></script>
<script src="admin.js"></script>
</body>
</html>
